name: Android CI - Fixed Version

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 40

    steps:
      # 1. Подготовка окружения
      - name: Checkout with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Настройка Java с кешированием
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'
          check-latest: true

      # 3. Фикс Gradle
      - name: Fix Gradle Environment
        run: |
          # Принудительное обновление wrapper
          ./gradlew wrapper --gradle-version 8.10 --distribution-type bin
          
          # Очистка кешей
          ./gradlew --stop
          rm -rf ~/.gradle/caches
          
          # Права на исполнение
          chmod +x gradlew
          ./gradlew --version

      # 4. Сборка с проверкой deprecated API
      - name: Build with Deprecation Checks
        run: |
          ./gradlew clean assembleDebug \
            --warning-mode=all \
            --stacktrace \
            --scan \
            --no-daemon \
            --refresh-dependencies \
            --continue

      # 5. Анализ результатов
      - name: Check Build Status
        if: always()
        run: |
          if [ -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
            echo "BUILD_SUCCEEDED=true" >> $GITHUB_ENV
            echo "::notice::Build completed successfully"
          else
            echo "::error::Build failed - check deprecation warnings"
            grep -r "deprecated" build/reports/ || true
          fi

      # 6. Альтернативная загрузка артефактов
      - name: Upload Artifacts
        if: env.BUILD_SUCCEEDED == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: app-build
          path: |
            app/build/outputs/apk/**/*.apk
            build/reports/**/*.html
          retention-days: 7

      # 7. Отчет о deprecated API
      - name: Upload Deprecation Report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: deprecation-warnings
          path: |
            build/reports/**/*
            **/build/tmp/**/*.log
          retention-days: 3
