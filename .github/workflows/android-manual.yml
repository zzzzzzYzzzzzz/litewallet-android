name: Android Build (No Upload-Artifact)

on:
  workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 45

    steps:
      # 1. Альтернативный способ загрузки кода
      - name: Direct Git Clone
        run: |
          git clone https://github.com/$GITHUB_REPOSITORY.git .
          git checkout $GITHUB_REF
          git submodule update --init --recursive
        env:
          GITHUB_REF: ${{ github.ref }}

      # 2. Ручная установка Java
      - name: Manual Java 17 Setup
        run: |
          sudo apt update
          sudo apt install -y openjdk-17-jdk
          echo "JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64" >> $GITHUB_ENV

      # 3. Сборка APK
      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace \
            --info \
            --refresh-dependencies

      # 4. Альтернативная загрузка результатов
      - name: Create Download Link
        run: |
          sudo apt install -y zip
          zip -r build_output.zip app/build/outputs/apk/
          echo "DOWNLOAD_URL=curl -u $GITHUB_ACTOR:$GH_TOKEN -X POST https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?name=build_output.zip --data-binary @build_output.zip" >> $GITHUB_ENV
          echo "::notice::Download APK manually from artifacts directory"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
