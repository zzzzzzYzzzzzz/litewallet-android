name: Android Build (Stable)

on:
  workflow_dispatch:  # Только ручной запуск для стабильности

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 45

    steps:
      # Шаг 1: Альтернативный способ загрузки кода
      - name: Deep Clone Repository
        run: |
          git clone --depth=1 --branch=$GITHUB_REF_NAME https://github.com/$GITHUB_REPOSITORY.git .
          git submodule update --init --recursive
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}

      # Шаг 2: Ручная установка Java (без actions/setup-java)
      - name: Install Java 17 Manually
        run: |
          sudo apt-get update
          sudo apt-get install -y zulu17-jdk
          echo "JAVA_HOME=/usr/lib/jvm/zulu17" >> $GITHUB_ENV

      # Шаг 3: Настройка Gradle
      - name: Setup Gradle
        run: |
          chmod +x gradlew
          ./gradlew --version --stacktrace

      # Шаг 4: Сборка с очисткой
      - name: Clean Build
        run: |
          ./gradlew clean
          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace \
            --info \
            --refresh-dependencies

      # Шаг 5: Альтернативная загрузка артефактов
      - name: Package and Upload
        run: |
          mkdir artifacts
          cp app/build/outputs/apk/debug/*.apk artifacts/
          tar czvf build_artifacts.tar.gz artifacts/
          echo "ARTIFACT_PATH=build_artifacts.tar.gz" >> $GITHUB_ENV

      # Шаг 6: Ручная загрузка через API
      - name: Upload via GitHub API
        run: |
          curl -X POST \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Content-Type: application/octet-stream" \
            --data-binary @$ARTIFACT_PATH \
            "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?name=build_artifacts.tar.gz"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.create_release.outputs.id }}
