name: Android Build (Fixed)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: Checkout code (forced)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java (forced clean)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'
          check-latest: true  # Критически важный параметр

      - name: Fix permissions
        run: |
          sudo chmod +x gradlew
          ./gradlew --version

      - name: Build with Gradle
        run: |
          ./gradlew assembleDebug \
          --no-daemon \
          --stacktrace \
          --info \
          --refresh-dependencies  # Форсированное обновление

      - name: Upload Artifact (fixed)
        uses: actions/upload-artifact@v4-beta  # Альтернатива при проблемах с v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
