name: Android Build (Fixed Version)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: Force Clean Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          clean: true

      - name: Setup Java (Force Latest)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          check-latest: true
          cache: 'gradle'

      - name: Fix Gradle Environment
        run: |
          sudo rm -rf ~/.gradle/caches
          chmod +x gradlew
          ./gradlew --stop

      - name: Build with Gradle (Clean)
        run: |
          ./gradlew assembleDebug \
          --no-daemon \
          --stacktrace \
          --info \
          --refresh-dependencies \
          --build-cache

      - name: Upload Artifact (Alternative)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-build
          path: |
            app/build/outputs/apk/**/*.apk
            app/build/outputs/mapping/**/*.mapping
          retention-days: 3
